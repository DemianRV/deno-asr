[package]
name = "asr-helper"
version = "0.1.0"
edition = "2024"
description = "Native helper for deno-asr: microphone capture and global hotkey over a JSON-lines stdio protocol"
license = "MIT"

[dependencies]
anyhow = "1"
cpal = "0.18"
global-hotkey = "0.8"
hound = "3.5"
rubato = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
tao = "0.37"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
